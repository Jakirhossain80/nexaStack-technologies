packages:
  - apps/*
  - packages/*

# Versions used by more than one workspace. Reference with "catalog:" in package.json.
catalog:
  '@types/node': 22.20.2
  typescript: 6.0.3
  zod: 4.6.2

# Dependencies permitted to run install scripts.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - tailwind-merge@3.7.0
